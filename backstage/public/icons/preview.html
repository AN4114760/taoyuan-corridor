<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>障礙物素材預覽</title>
<style>
  body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #f3f4f6; color: #22292F; }
  h1 { font-size: 20px; margin: 0 0 4px; } p { margin: 0 0 18px; color: #555; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  figure { margin: 0; background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
  .pair img { width: 100%; height: 150px; object-fit: contain; }
  .pair img:first-child { background: #c9c3b8; border-radius: 10px; }
  figcaption { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; font-size: 13px; }
  code { color: #6B7280; font-size: 12px; }
  .row { display: flex; gap: 18px; align-items: end; flex-wrap: wrap; background: #8cc56a; border-radius: 14px; padding: 16px; margin-top: 18px; }
  .row img { height: 96px; }
</style></head><body>
<h1>障礙物素材（2D 扁平賽璐珞風）</h1>
<p>左：純物件版（240×280，放在人行道磚色背景上）　右：紅色水滴地標版（280×340）</p>
<div class="grid">
<figure><div class="pair"><img src="obstacle-box.svg" alt=""><img src="pin-box.svg" alt=""></div>
  <figcaption><b>變電箱</b><code>obstacle-box.svg</code><code>pin-box.svg</code></figcaption></figure>
<figure><div class="pair"><img src="obstacle-car.svg" alt=""><img src="pin-car.svg" alt=""></div>
  <figcaption><b>違停轎車</b><code>obstacle-car.svg</code><code>pin-car.svg</code></figcaption></figure>
<figure><div class="pair"><img src="obstacle-cone.svg" alt=""><img src="pin-cone.svg" alt=""></div>
  <figcaption><b>施工三角錐</b><code>obstacle-cone.svg</code><code>pin-cone.svg</code></figcaption></figure>
<figure><div class="pair"><img src="obstacle-pothole.svg" alt=""><img src="pin-pothole.svg" alt=""></div>
  <figcaption><b>人行道坑洞</b><code>obstacle-pothole.svg</code><code>pin-pothole.svg</code></figcaption></figure>
<figure><div class="pair"><img src="obstacle-scooter.svg" alt=""><img src="pin-scooter.svg" alt=""></div>
  <figcaption><b>機車停放佔用</b><code>obstacle-scooter.svg</code><code>pin-scooter.svg</code></figcaption></figure>
<figure><div class="pair"><img src="obstacle-signboard.svg" alt=""><img src="pin-signboard.svg" alt=""></div>
  <figcaption><b>店家佔用立牌</b><code>obstacle-signboard.svg</code><code>pin-signboard.svg</code></figcaption></figure>
<figure><div class="pair"><img src="obstacle-trash.svg" alt=""><img src="pin-trash.svg" alt=""></div>
  <figcaption><b>堆置垃圾袋</b><code>obstacle-trash.svg</code><code>pin-trash.svg</code></figcaption></figure>
</div>
<div class="row"><img src="obstacle-box.svg" alt=""><img src="obstacle-car.svg" alt=""><img src="obstacle-cone.svg" alt=""><img src="obstacle-pothole.svg" alt=""><img src="obstacle-scooter.svg" alt=""><img src="obstacle-signboard.svg" alt=""><img src="obstacle-trash.svg" alt=""><img src="/frog/back.png" alt="" style="height:110px"></div>
</body></html>
